name: apply-overview-provider-contract

on:
  push:
    branches: [audit/overview-provider-contract]
    paths:
      - '.github/scripts/apply_overview_provider_contract.py'
      - '.github/workflows/apply-overview-provider-contract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/overview-provider-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 .github/scripts/apply_overview_provider_contract.py
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Remove one-shot machinery and commit
        run: |
          rm -f .github/scripts/apply_overview_provider_contract.py .github/workflows/apply-overview-provider-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Overview provider SDK contract'
          git push origin HEAD:audit/overview-provider-contract
