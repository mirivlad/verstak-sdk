name: search-provider-contract

on:
  push:
    branches:
      - audit/search-provider-contract

permissions:
  contents: write

concurrency:
  group: search-provider-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply Search contract
        run: python3 .github/scripts/search_provider_contract.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build generated dist
        run: npm run build

      - name: Run SDK checks
        run: bash scripts/check.sh

      - name: Run SDK tests
        run: npm test

      - name: Contract assertions
        run: |
          grep -q 'export interface SearchProviderRequest' src/types.ts
          grep -q "kind: 'workspace-item'" src/types.ts
          grep -q 'resource: OpenResourceRequest' src/types.ts
          grep -q 'export interface SearchProviderResponse' src/types.ts
          git diff --check

      - name: Remove one-shot machinery and commit
        run: |
          rm .github/scripts/search_provider_contract.py .github/workflows/search-provider-contract.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: define Search provider result contract'
          git push origin HEAD:audit/search-provider-contract
