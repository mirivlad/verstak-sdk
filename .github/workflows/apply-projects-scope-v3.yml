name: Apply Projects Scope v3

on:
  push:
    branches: [projects-scope-v3-apply]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo "99bbba1140021ace19bcc91eb6c1665043df522577b87e6c51b81f8c440cdf85  .github/projects-scope-v3.patch" | sha256sum -c -
          git apply --check .github/projects-scope-v3.patch
          git apply .github/projects-scope-v3.patch
          rm .github/projects-scope-v3.patch .github/workflows/apply-projects-scope-v3.yml
      - name: Test and build
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sdk: add workspace navigation contract"
          git push origin HEAD:projects-scope-v3-apply
